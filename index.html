<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Manual JavaScript - Prática</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Aprendendo JavaScript</h1>

  <p id="texto">Clique no botão para mudar este texto</p>
  <button onclick="mudarTexto()">Clique aqui</button>

  <h2>Formulário</h2>
  <input type="text" id="nome" placeholder="Digite seu nome">
  <button onclick="mostrarNome()">Enviar</button>
  <p id="resultado"></p>

  <h2>Verificar idade</h2>
  <input type="number" id="idade" placeholder="Digite sua idade">
  <button onclick="verificarIdade()">Verificar</button>
  <p id="respostaIdade"></p>

  <h2>Contador</h2>
  <button onclick="contar()">Contar de 1 a 5</button>
  <ul id="lista"></ul>

  <script src="script.js"></script>
</body>
</html>
